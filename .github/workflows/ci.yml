name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Proprietary WAVs are intentionally absent from the public repository.
      # Distribution builds default to requiring them outside this workflow.
      REQUIRE_SOUND_ASSETS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install repository tools
        run: brew bundle

      - name: Run validation gates
        run: scripts/validate.sh all
